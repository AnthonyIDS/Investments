name: Update prices

on:
  schedule:
    # Weekdays at 21:30 UTC (5:30 pm New York, after the close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/market.json && git ls-files --error-unmatch data/market.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
